<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Acre Scouts contact</title>
  <link rel="stylesheet" href="../contact.css">
</head>
<body>
  <main class="card" data-contact-page hidden>
    <div class="brand" data-company-name>Acre Scouts</div>
    <div class="content">
      <img class="photo" data-photo src="" alt="">
      <h1 data-name></h1>
      <p class="role" data-role></p>
      <div class="actions">
        <a data-linkedin target="_blank" rel="noopener">LinkedIn</a>
        <a data-website>Visit Acre Scouts</a>
      </div>
      <div class="contact-details">
        <p data-phone hidden><a></a></p>
        <p data-whatsapp hidden><a>WhatsApp</a></p>
        <p data-email hidden><a></a></p>
      </div>
    </div>
  </main>
  <p class="notice" data-error hidden>This contact page is unavailable.</p>
  <script src="../contact-page.js"></script>
</body>
</html>
